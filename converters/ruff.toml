# 変換コマンドの Python 実装の ruff の設定。CI の「コーディング規約」ジョブで使う。

# 対応する最も古い Python（converters/README.md の「必要なツール」と CI の converters-python-oldest ジョブ）に合わせ、
# その版で使えない書き方を提案させない
target-version = "py310"

[lint]
# 既定の規則（E4・E7・E9・F）に加え、次を確かめる。
# I: import の並び、N: PEP 8 の命名、UP: target-version に合った書き方、B: よくある不具合
extend-select = ["I", "N", "UP", "B"]
