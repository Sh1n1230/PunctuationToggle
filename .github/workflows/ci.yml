name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS アプリ
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 単体テスト
        working-directory: macOS
        run: swift test

      # 設定は macOS/.swift-format
      - name: コーディング規約（swift format）
        working-directory: macOS
        run: swift format lint --strict -r Package.swift PunctuationToggle Scripts Tests

      - name: ビルド
        working-directory: macOS
        run: >
          xcodebuild -project PunctuationToggle.xcodeproj -scheme PunctuationToggle
          -configuration Release -destination "platform=macOS" -derivedDataPath build
          CODE_SIGN_IDENTITY=- build

      # Hardened Runtime が無いと、DYLD_INSERT_LIBRARIES などで注入したコードがアクセシビリティの権限を使えてしまう
      - name: Hardened Runtime の確認
        run: |
          code_directory=$(codesign -dv macOS/build/Build/Products/Release/PunctuationToggle.app 2>&1 | grep '^CodeDirectory')
          echo "$code_directory"
          case "$code_directory" in
            *runtime*) ;;
            *) echo "::error::Hardened Runtime が有効になっていません"; exit 1 ;;
          esac

  windows:
    name: Windows アプリ
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: ビルド
        run: dotnet build Windows/PunctuationToggle.sln -c Release

      - name: 単体テスト
        run: dotnet test Windows/PunctuationToggle.sln -c Release --no-build

      # Windows PowerShell 5.1 で、インストール・起動・アンインストールが通ることを確認する。
      # ここに書いたスクリプトは BOM なしで保存されて 5.1 では UTF-8 として読まれないため、ASCII の文字だけで書く。
      - name: インストールとアンインストール
        shell: powershell
        run: |
          .\Windows\install.ps1
          Start-Sleep -Seconds 5
          if (-not (Get-Process PunctuationToggle -ErrorAction SilentlyContinue)) {
            throw 'PunctuationToggle is not running after installation.'
          }
          .\Windows\uninstall.ps1
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\PunctuationToggle')) {
            throw 'Installed files remain after uninstallation.'
          }

  converters:
    name: 変換コマンド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: converters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Native AOT のビルドに必要なパッケージ
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: ビルド
        run: make all csharp-dotnet

      - name: テスト
        run: REQUIRE_ALL=1 make test

      - name: Rust 実装の単体テスト
        run: make rust-test

  # converters/README.md の「必要なツール」に書いた最も古い版で、Python 実装が動くことを確かめる
  converters-python-oldest:
    name: 変換コマンド（Python 3.10）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: converters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: テスト
        run: REQUIRE_ALL=1 tests/run_tests.sh python

  # CONTRIBUTING の「コーディング規約」に合っているかを確かめる。
  # Swift は Xcode のツールチェーンに同梱の swift format を使うため、macOS アプリのジョブで確かめる
  lint:
    name: コーディング規約
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # ruff・mypy・ShellCheck は、版と sha256 を固定して導入する
      - name: ツールの導入
        run: pip install --require-hashes --no-deps -r .github/lint/requirements.txt

      - name: Rust（rustfmt・Clippy）
        run: |
          rustfmt --version
          rustfmt --check --edition 2021 converters/punctuation_converter.rs
          clippy-driver --edition 2021 -D warnings -o "$RUNNER_TEMP/punctuation_converter" converters/punctuation_converter.rs
          clippy-driver --edition 2021 -D warnings --test -o "$RUNNER_TEMP/punctuation_converter_test" converters/punctuation_converter.rs

      - name: Python（ruff・mypy）
        run: |
          ruff check converters
          ruff format --check --diff converters
          mypy --strict --python-version 3.10 converters/punctuation_converter.py

      - name: シェルスクリプト（ShellCheck）
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: C#（dotnet format）
        run: |
          dotnet format Windows/PunctuationToggle.sln --verify-no-changes
          dotnet format converters/dotnet/PunctuationConverter.csproj --verify-no-changes
