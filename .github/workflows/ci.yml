name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じ Pull Request に続けて push したときは、古い実行を取り消す（main への push は取り消さない）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read


# Linux・macOS の run: を bash -eo pipefail で実行し、パイプの途中の失敗も検出する
# （shell を指定しないと sh -e で実行され、pipefail が付かない）。Windows の手順は、それぞれ shell を指定する
defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS アプリ
    runs-on: macos-26
    # ハングしたときに既定の 360 分までランナーを使い続けないよう、今の実行時間の数倍で止める（ほかのジョブも同じ）
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 単体テスト
        working-directory: macOS
        run: swift test --enable-code-coverage

      # カバレッジは、まずは結果を見えるようにするだけで、下限は設けない
      - name: カバレッジの集計
        working-directory: macOS
        run: |
          bin_path=$(swift build --show-bin-path)
          # テストのバンドルの名前は Swift の版で違う（PunctuationToggleCorePackageTests など）ため、探して使う
          test_bundle=$(find "$bin_path" -maxdepth 1 -name '*.xctest' | head -n 1)
          if [ -z "$test_bundle" ] || [ ! -f "$bin_path/codecov/default.profdata" ]; then
            echo "::error::カバレッジのデータ（$bin_path の *.xctest と codecov/default.profdata）が見つかりません。swift test --enable-code-coverage の実行を確かめてください。"
            exit 1
          fi
          {
            echo "### macOS 版の Core のカバレッジ"
            echo '```'
            xcrun llvm-cov report -instr-profile "$bin_path/codecov/default.profdata" \
              "$test_bundle/Contents/MacOS/$(basename "$test_bundle" .xctest)" \
              -ignore-filename-regex='(Tests|\.build)/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 設定は macOS/.swift-format
      - name: コーディング規約（swift format）
        working-directory: macOS
        run: swift format lint --strict -r Package.swift PunctuationToggle Scripts Tests

      - name: ビルド
        working-directory: macOS
        run: >
          xcodebuild -project PunctuationToggle.xcodeproj -scheme PunctuationToggle
          -configuration Release -destination "platform=macOS" -derivedDataPath build
          CODE_SIGN_IDENTITY=- build

      # Hardened Runtime が無いと、DYLD_INSERT_LIBRARIES などで注入したコードがアクセシビリティの権限を使えてしまう
      - name: Hardened Runtime の確認
        run: |
          code_directory=$(codesign -dv macOS/build/Build/Products/Release/PunctuationToggle.app 2>&1 | grep '^CodeDirectory')
          echo "$code_directory"
          case "$code_directory" in
            *runtime*) ;;
            *) echo "::error::Hardened Runtime が有効になっていません"; exit 1 ;;
          esac

  windows:
    name: Windows アプリ
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: .NET SDK の導入
        uses: ./.github/actions/setup-dotnet

      - name: ビルド
        shell: pwsh
        run: |
          dotnet --version
          dotnet build Windows/PunctuationToggle.sln -c Release

      - name: 単体テスト
        shell: pwsh
        run: >
          dotnet test Windows/PunctuationToggle.sln -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory "${{ runner.temp }}/coverage"

      # カバレッジは、まずは結果を見えるようにするだけで、下限は設けない
      # Python の出力を UTF-8 のまま書き出すよう、PowerShell ではなく Git Bash で実行する
      - name: カバレッジの集計
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          reports=$(find "$RUNNER_TEMP/coverage" -name coverage.cobertura.xml)
          if [ -z "$reports" ]; then
            echo "::error::カバレッジのレポート（coverage.cobertura.xml）が $RUNNER_TEMP/coverage に見つかりません。dotnet test の --collect の指定を確かめてください。"
            exit 1
          fi
          if [ "$(echo "$reports" | wc -l)" -gt 1 ]; then
            echo "::warning::カバレッジのレポートが複数あります。1つ目だけを集計します: $reports"
          fi
          report=$(echo "$reports" | head -n 1)
          {
            echo "### Windows 版の Core のカバレッジ"
            python .github/scripts/cobertura_summary.py "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: カバレッジを成果物として保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-coverage
          path: ${{ runner.temp }}/coverage
          if-no-files-found: error

      # Windows PowerShell 5.1 で、インストール・起動・アンインストールが通ることを確認する。
      # ここに書いたスクリプトは BOM なしで保存されて 5.1 では UTF-8 として読まれないため、ASCII の文字だけで書く。
      - name: インストールとアンインストール
        shell: powershell
        run: |
          .\Windows\install.ps1
          # Wait up to 30 seconds for the process to start, instead of a fixed sleep.
          $process = $null
          for ($attempt = 0; $attempt -lt 30 -and -not $process; $attempt++) {
            Start-Sleep -Seconds 1
            $process = Get-Process PunctuationToggle -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $process) {
            throw 'PunctuationToggle did not start within 30 seconds after installation.'
          }
          # It must still be running a few seconds later (not exited right after an error).
          Start-Sleep -Seconds 3
          $process.Refresh()
          if ($process.HasExited) {
            throw "PunctuationToggle exited after starting (exit code: $($process.ExitCode))."
          }
          # An error dialog (MessageBox) would give the process a visible main window.
          if ($process.MainWindowTitle) {
            throw "PunctuationToggle shows a window after starting: $($process.MainWindowTitle)"
          }
          .\Windows\uninstall.ps1
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\PunctuationToggle')) {
            throw 'Installed files remain after uninstallation.'
          }

  # 変換コマンドは macOS と Windows で使うことを想定しているため、3つの OS で確かめる。
  # OS ごとに違う処理（Python の Windows での標準出力の扱い、Makefile のランタイム識別子、Native AOT のビルド）を含む
  converters:
    name: 変換コマンド（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    defaults:
      run:
        working-directory: converters
        # Windows でも Git Bash で、ほかの OS と同じスクリプトを実行する
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: .NET SDK の導入
        uses: ./.github/actions/setup-dotnet

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Rust のツールチェーンの導入
        uses: ./.github/actions/setup-rust

      # macOS は Xcode、Windows は Visual Studio の C++ ツールがランナーに入っている
      - name: Native AOT のビルドに必要なパッケージ（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Windows のランナーには make が無いため、Chocolatey で版を固定して入れる（Chocolatey はダウンロードしたファイルを
      # パッケージに書かれた sha256 で確かめる）。MSYS2 の make は、起動する dotnet に環境変数が正しく渡らず NuGet が失敗した。
      # python3 も無いので python を使う
      - name: make の導入（Windows）
        if: runner.os == 'Windows'
        run: |
          # Chocolatey のフィードは一時的に 503 を返すことがあるため、少し待って3回まで試す
          for attempt in 1 2 3; do
            choco install make --version 4.4.1 --no-progress -y && break
            [[ $attempt -eq 3 ]] && exit 1
            sleep 30
          done
          echo "PYTHON=python" >> "$GITHUB_ENV"

      - name: ビルド
        run: make all csharp-dotnet

      - name: テスト
        run: REQUIRE_ALL=1 make test

      - name: Rust 実装の単体テスト
        run: make rust-test

      # 失敗した入力は tests/cases/ と同じ形で保存されるので、成果物として残す
      - name: ランダムな入力でのテスト
        run: REQUIRE_ALL=1 RANDOM_FAILURES_DIR="$RUNNER_TEMP/random-failures" make test-random

      - name: ランダムな入力でのテストで失敗した入力の保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: random-failures-${{ matrix.os }}
          path: ${{ runner.temp }}/random-failures
          if-no-files-found: ignore
          retention-days: 14

  # converters/README.md の「必要なツール」に書いた最も古い版と、最新の安定版で、Python 実装が動くことを確かめる
  converters-python:
    name: 変換コマンド（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 最新の安定版は、新しい版が出たら上げる（ランナーと同じく、版を固定して変更を見えるようにする）
        python-version: ["3.10", "3.15"]
    defaults:
      run:
        shell: bash
        working-directory: converters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: テスト
        run: REQUIRE_ALL=1 tests/run_tests.sh python

      # Rust と C# はこのジョブではビルドしないため、実装名を指定する
      - name: ランダムな入力でのテスト
        run: REQUIRE_ALL=1 python tests/run_random_tests.py python

  # CONTRIBUTING の「コーディング規約」に合っているかを確かめる。
  # Swift は Xcode のツールチェーンに同梱の swift format を使うため、macOS アプリのジョブで確かめる
  lint:
    name: コーディング規約
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: .NET SDK の導入
        uses: ./.github/actions/setup-dotnet

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # ruff・mypy・ShellCheck・check-jsonschema は、版と sha256 を固定して導入する。
      # sdist のビルドでは、ビルド時の依存が版と sha256 で固定されないため、wheel だけを使う
      - name: ツールの導入
        run: pip install --require-hashes --no-deps --only-binary ':all:' -r .github/lint/requirements.txt

      # actionlint は PyPI に sdist しか無い（ビルド時の依存を固定できない）ため、GitHub のリリースのバイナリを
      # 版と sha256 で固定して取得する。Dependabot の対象外なので、更新するときは版と、リリースの
      # actionlint_<版>_checksums.txt にある linux_amd64.tar.gz の sha256 を書き換える
      - name: actionlint の導入
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Rust のツールチェーンの導入
        uses: ./.github/actions/setup-rust

      # PSScriptAnalyzer は、GitHub のリリースのパッケージ（PowerShell Gallery と同じもの）を版と sha256 で固定して取得する
      # （Install-Module は取得したパッケージを sha256 で確かめられないため使わない）。
      # 版を変えるときは、GitHub のリリースのページに表示される sha256 も書き換える
      - name: PSScriptAnalyzer の導入
        env:
          PSSCRIPTANALYZER_VERSION: 1.25.0
          PSSCRIPTANALYZER_SHA256: 14e634c828eb98efb9f40b2918ba90f139ed5eccdf663a2a747736d996995d60
        run: |
          package="$RUNNER_TEMP/PSScriptAnalyzer.nupkg"
          curl -fsSL -o "$package" "https://github.com/PowerShell/PSScriptAnalyzer/releases/download/$PSSCRIPTANALYZER_VERSION/PSScriptAnalyzer.$PSSCRIPTANALYZER_VERSION.nupkg"
          echo "$PSSCRIPTANALYZER_SHA256  $package" | sha256sum --check
          unzip -q "$package" -d "$RUNNER_TEMP/PSScriptAnalyzer"

      - name: PowerShell（PSScriptAnalyzer）
        shell: pwsh
        run: |
          Import-Module (Join-Path $env:RUNNER_TEMP 'PSScriptAnalyzer/PSScriptAnalyzer.psd1')
          $results = Invoke-ScriptAnalyzer -Path Windows -Recurse -Settings .github/lint/PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) { throw "PSScriptAnalyzer の指摘が $($results.Count) 件あります。" }

      # Rust・Python・シェルスクリプト・Markdown のリンク・通信する API・ワークフロー・設定ファイルのスキーマ・C# の検査。
      # 手元でも同じ検査を実行できるよう、.github/lint/lint.sh にまとめてある（CONTRIBUTING の「書式の確認」）
      - name: 書式と静的解析（.github/lint/lint.sh）
        run: REQUIRE_ALL=1 .github/lint/lint.sh
