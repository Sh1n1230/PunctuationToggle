# 秘密情報の混入・危険なコード・依存の既知の脆弱性・設定の不備を検査する。
# 検査の中身は security-checker (https://github.com/Sh1n1230/security-checker) にあり、ここでは呼ぶだけ。
name: Security Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # 結果を GitHub の Code Scanning に登録するため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pull Request で差分だけを検査するとき、比較の基準（merge-base）を求めるのに履歴が必要
          fetch-depth: 0

      # v2.1.0 から、各スキャナを版と sha256 で固定して取得する（#14 の残り）
      - uses: Sh1n1230/security-checker@318c3995733ddb59dc065b497ac9ac07bbe49484 # v2.1.0
        with:
          # 結果は Code Scanning と実行結果のサマリーで確認する。
          # PR へのコメントには pull-requests: write が必要になるため、権限を増やさないよう使わない
          comment: "false"
