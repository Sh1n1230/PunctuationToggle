# 依存の更新を自動で提案させる。
version: 2

updates:
  # ワークフローのアクションはコミット SHA で固定しているため、人手では更新が漏れる
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 公開直後の版は、乗っ取りや不具合で取り下げられることがあるため、7日待ってから提案させる
    cooldown:
      default-days: 7

  # Windows 版のテストで使う NuGet パッケージ
  - package-ecosystem: nuget
    directory: /Windows
    schedule:
      interval: weekly
    # 公開直後の版は、乗っ取りや不具合で取り下げられることがあるため、7日待ってから提案させる
    cooldown:
      default-days: 7
    groups:
      test-packages:
        patterns: ["*"]
