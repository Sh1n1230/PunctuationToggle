# 依存の更新を自動で提案させる。
version: 2

updates:
  # ワークフローのアクションはコミット SHA で固定しているため、人手では更新が漏れる
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 公開直後の版は、乗っ取りや不具合で取り下げられることがあるため、7日待ってから提案させる
    cooldown:
      default-days: 7

  # CI の「コーディング規約」ジョブで使うツール（ruff・mypy・ShellCheck・actionlint）
  - package-ecosystem: pip
    directory: /.github/lint
    schedule:
      interval: weekly
    # 公開直後の版は、乗っ取りや不具合で取り下げられることがあるため、7日待ってから提案させる
    cooldown:
      default-days: 7
    groups:
      lint-tools:
        patterns: ["*"]

  # Windows 版のテストで使う NuGet パッケージ
  - package-ecosystem: nuget
    directory: /Windows
    schedule:
      interval: weekly
    # 公開直後の版は、乗っ取りや不具合で取り下げられることがあるため、7日待ってから提案させる
    cooldown:
      default-days: 7
    groups:
      test-packages:
        patterns: ["*"]

  # global.json の .NET SDK の版（配布する Windows 版の exe に含まれる .NET ランタイムの版も決まる）
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    # 公開直後の版は、乗っ取りや不具合で取り下げられることがあるため、7日待ってから提案させる
    cooldown:
      default-days: 7

  # rust-toolchain.toml の Rust の版（変換コマンドの Rust 実装と、rustfmt・Clippy の検査に使う）
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    # 公開直後の版は、乗っ取りや不具合で取り下げられることがあるため、7日待ってから提案させる
    cooldown:
      default-days: 7
